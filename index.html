<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight ID</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f6f6f6;
color:#222;
}

header{
background:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
position:sticky;
top:0;
}

.logo{
font-size:28px;
font-weight:bold;
color:#0066ff;
}

.hero{
padding:70px 20px;
text-align:center;
background:white;
}

.hero h1{
font-size:40px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#666;
margin-bottom:30px;
}

input{
width:90%;
max-width:450px;
padding:16px;
font-size:18px;
border-radius:10px;
border:1px solid #ddd;
}

.section{
padding:35px 20px;
}

.section h2{
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:8px;
}

button{
margin-top:15px;
padding:12px 18px;
border:none;
background:#0066ff;
color:white;
border-radius:8px;
cursor:pointer;
}

footer{
padding:30px;
text-align:center;
color:#666;
}

</style>

</head>

<body>

<header>

<div class="logo">
Spotlight ID
</div>

</header>

<section class="hero">

<h1>Discover Creators</h1>

<p>
Profiles of creators, artists, and public figures.
</p>

<input placeholder="Search creators...">

</section>

<section class="section">

<h2>Featured Profile</h2>

<div class="card">

<h3>DEE</h3>

<p>
TikTok Creator, Story Writer, and Content Creator.
</p>

<button onclick="window.location.href='dee.html'">
View Profile
</button>

</div>

</section>

<footer>

© 2026 Spotlight ID

</footer>

</body>
</html>
